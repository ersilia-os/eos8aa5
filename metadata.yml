Identifier: eos8aa5
Slug: kgpgt-embedding
Status: Ready
Title: Knowledge-guided pre-trained graph transformer
Description: Encodes a molecule into 2,304 features with KPGT, whose backbone 
  treats the molecular line graph so that bonds become nodes and a transformer 
  can attend across the whole structure. Li and colleagues pretrained it on 
  about two million ChEMBL compounds using a masked-graph objective augmented 
  with a knowledge node carrying molecular descriptors and fingerprints, so 
  established chemistry guides the representation instead of the network 
  rediscovering it. The embedding transferred across 63 property prediction 
  datasets, and its individual dimensions carry no separate meaning.
