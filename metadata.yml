Title: Knowledge-guided pre-trained graph transformer
Description: Encodes a molecule into 2,304 features using KPGT, a graph transformer pretrained with chemical knowledge folded into the objective rather than learned from structure alone. The authors had the model predict molecular descriptors and fingerprints during pretraining, so that established chemical understanding guides representation learning instead of leaving the network to rediscover it. The embedding transfers across property prediction tasks, and its dimensions are not individually interpretable.
